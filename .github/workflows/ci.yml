name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-env-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if tracked .env files exist
        run: |
          if git ls-files | grep -E "(^|/)\.env($|\.)" | grep -vE "\.env\.example$"; then
            echo "Tracked .env files present - remove them before committing." >&2
            git ls-files | grep -E "(^|/)\.env($|\.)" | grep -vE "\.env\.example$"
            exit 1
          fi

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend deps
        run: |
          cd frontend
          npm ci
      - name: Run frontend lint
        run: |
          cd frontend
          npm run lint
      - name: Run frontend build
        run: |
          cd frontend
          npm run build

  verify-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install delegated functions deps
        run: |
          cd functions
          npm ci --omit=dev
      - name: Run backend lint
        run: |
          cd backend
          npm run lint
      - name: Smoke test backend health route
        run: |
          CLERK_SECRET_KEY=sk_test_dummy \
          SUPABASE_URL=https://example.supabase.co \
          SUPABASE_SERVICE_ROLE_KEY=dummy \
          PORT=8010 \
          node backend/server.js &
          SERVER_PID=$!
          sleep 3
          curl --fail http://127.0.0.1:8010/health
          kill $SERVER_PID
